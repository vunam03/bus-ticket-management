spring.application.name=bus-ticket-management

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bus_ticket_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Module 2 - account and session configuration
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.bootstrap.admin.username=${ADMIN_USERNAME:}
app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}
app.mail.from=${MAIL_FROM:noreply@localhost}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.jpa.open-in-view=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
server.error.include-message=never
server.error.include-stacktrace=never
