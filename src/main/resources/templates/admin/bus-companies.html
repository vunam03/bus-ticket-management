<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Nhà Xe</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Quản lý Danh Sách Nhà Xe</h2>
        <a th:href="@{/admin/trips}" class="btn btn-outline-primary">Quản lý Chuyến Xe &rarr;</a>
    </div>

    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">Thêm Nhà Xe Mới</div>
        <div class="card-body">
            <form th:action="@{/admin/bus-companies/save}" th:object="${company}" method="post" class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Tên nhà xe</label>
                    <input type="text" th:field="*{name}" class="form-control" required placeholder="Ví dụ: Phương Trang">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Số điện thoại</label>
                    <input type="text" th:field="*{phoneNumber}" class="form-control" placeholder="0901234567">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Địa chỉ</label>
                    <input type="text" th:field="*{address}" class="form-control" placeholder="Hà Nội...">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-success w-100">Lưu Nhà Xe</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-bordered table-striped align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Tên nhà xe</th>
                    <th>Số điện thoại</th>
                    <th>Địa chỉ</th>
                    <th>Đánh giá</th>
                    <th class="text-center">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${companies}">
                    <td th:text="${c.id}">1</td>
                    <td th:text="${c.name}">Hoàng Long</td>
                    <td th:text="${c.phoneNumber}">0987654321</td>
                    <td th:text="${c.address}">Hà Nội</td>
                    <td th:text="${c.rating != null ? c.rating + ' ★' : 'Chưa có'}">4.5 ★</td>
                    <td class="text-center">
                        <a th:href="@{/admin/bus-companies/delete/{id}(id=${c.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Bạn có chắc chắn muốn xóa nhà xe này?')">Xóa</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(companies)}">
                    <td colspan="6" class="text-center text-muted">Chưa có nhà xe nào trong hệ thống.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
