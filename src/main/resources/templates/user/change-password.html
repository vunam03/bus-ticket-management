<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/account :: head('Đổi mật khẩu')}"></head>
<body>
<nav th:replace="~{fragments/account :: nav}"></nav>
<main class="container account-main">
    <div class="account-layout ">
        <aside class="account-story">
            <span class="eyebrow">HÀNH TRÌNH CỦA BẠN</span>
            <h1>Giữ tài khoản của bạn an toàn.</h1>
            <p>Bạn sẽ đăng nhập lại sau khi đổi mật khẩu thành công.</p>
            <div class="journey-line" aria-hidden="true">
                <span>Hà Nội</span><span class="journey-track"></span><span>Hải Phòng</span>
            </div>
            <ul class="story-points">
                <li>Thông tin tài khoản được quản lý tập trung</li>
                <li>Truy cập theo đúng quyền của bạn</li>
                <li>Chủ động cập nhật và bảo vệ tài khoản</li>
            </ul>
        </aside>
        <section class="account-card" aria-labelledby="page-heading">
            <div th:replace="~{fragments/account :: messages}"></div>

            <span class="section-kicker">CÀI ĐẶT BẢO MẬT</span>
            <h2 id="page-heading">Đổi mật khẩu</h2>
            <form th:action="@{/user/change-password}" th:object="${changePasswordRequest}" method="post" data-validate>

                    <div class="field-group">
                        <label class="form-label" for="currentPassword">Mật khẩu hiện tại</label>
                        <div class="password-input">
                            <input class="form-control" type="password" id="currentPassword" name="currentPassword"
                                   th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'"
                                   required maxlength="64" autocomplete="current-password">
                            <button type="button" class="password-toggle" data-toggle-password="currentPassword" aria-label="Hiện mật khẩu" aria-pressed="false">Hiện</button>
                        </div>
                        <div class="field-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
                    </div>

                    <div class="field-group">
                        <label class="form-label" for="newPassword">Mật khẩu mới</label>
                        <div class="password-input">
                            <input class="form-control" type="password" id="newPassword" name="newPassword"
                                   th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                                   required minlength="8" maxlength="64" autocomplete="new-password" data-strong-password aria-describedby="password-hint">
                            <button type="button" class="password-toggle" data-toggle-password="newPassword" aria-label="Hiện mật khẩu" aria-pressed="false">Hiện</button>
                        </div>
                        <div class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                    </div>
                <div th:replace="~{fragments/account :: passwordHint}"></div>
                <div class="password-meter" data-password-meter aria-live="polite"></div>

                    <div class="field-group">
                        <label class="form-label" for="confirmPassword">Xác nhận mật khẩu mới</label>
                        <div class="password-input">
                            <input class="form-control" type="password" id="confirmPassword" name="confirmPassword"
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                                   required maxlength="64" autocomplete="new-password" data-match="newPassword">
                            <button type="button" class="password-toggle" data-toggle-password="confirmPassword" aria-label="Hiện mật khẩu" aria-pressed="false">Hiện</button>
                        </div>
                        <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                    </div>
                <button class="btn btn-primary w-100" type="submit">Đổi mật khẩu</button>
            </form>
            <p class="card-bottom"><a th:href="@{/user/profile}">Quay lại hồ sơ</a></p>

        </section>
    </div>
</main>
<footer th:replace="~{fragments/account :: footer}"></footer>
</body>
</html>
