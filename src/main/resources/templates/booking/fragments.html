<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Hành Trình'">Hành Trình</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/booking.css}">
    <script defer th:src="@{/js/booking.js}"></script>
</head>
<body>
<header class="site-header" th:fragment="header">
    <a class="brand" th:href="@{/booking/trips}"><span class="brand-icon">H</span> HÀNH TRÌNH<span class="brand-dot">.</span></a>
    <nav aria-label="Điều hướng chính">
        <a th:href="@{/booking/trips}">Chọn chuyến</a>
        <a th:href="@{/user/my-tickets}">Vé của tôi</a>
        <a class="nav-profile" th:href="@{/user/profile}">Tài khoản ↗</a>
    </nav>
</header>
<div th:fragment="messages" class="messages" aria-live="polite">
    <div class="notice notice-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="notice notice-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
</div>
<footer th:fragment="footer" class="site-footer">
    <span>HÀNH TRÌNH / Hà Nội — Hải Phòng</span>
    <span>Đặt vé · Quản lý hành trình · Vé điện tử</span>
</footer>
</body>
</html>
