# Run with --spring.profiles.active=local. No MySQL/SMTP needed.
# Bind only to the local machine; development mailbox contains reset links.
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:file:./work/local-db/bus-ticket;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false
